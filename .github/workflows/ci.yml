name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint markdown
        run: npm run lint:md

      - name: Lint app
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build app
        # CI has no scrape and no business fetching one — it only needs to
        # know the app compiles. Everywhere else a missing dataset is a
        # broken deploy and stops the build.
        env:
          ALLOW_EMPTY_DATASET: "1"
        run: npm run build

      # The e2e suite starts the build above with its own runtime data —
      # see playwright.config.ts — so it needs no scrape either.
      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Test end to end
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
